# packages/vtoken is intentionally a Python/uv sidecar, not a pnpm workspace package.
# See packages/vtoken/README.md and docs/dev/repository-layout.md.
packages:
  - '.'
  - 'harness'
  - 'packages/versebrowser'
  - 'resources/verseshell-mcp'

shamefullyHoist: true

overrides:
  isbinaryfile: ^5.0.0

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

# electron/esbuild stay false: CI fetches the Electron binary itself
# (see .github/workflows/electron-e2e.yml), esbuild ships platform binaries.
allowBuilds:
  '@discordjs/opus': true
  '@google/genai': false
  '@whiskeysockets/baileys': true
  baileys: false
  electron: false
  electron-winstaller: false
  esbuild: false
  koffi: true
  node-llama-cpp: true
  openclaw: false
  protobufjs: true
  sharp: true
  tree-sitter-bash: false

# TEMP: allow baileys@7.0.0-rc.9 -> libsignal git subdependency.
# pnpm@11 defaults blockExoticSubdeps=true which fails fresh `pnpm install`.
# Debt: upgrade baileys >=7.0.0-rc12 (GHSA-qvv5-jq5g-4cgg) then drop this flag.
# Tracked as production-readiness backlog; not fixed in this change set.
blockExoticSubdeps: false

patchedDependencies:
  vaul@1.1.2: patches/vaul@1.1.2.patch
