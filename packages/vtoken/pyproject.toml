[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verse-token"
version = "0.4.3"
description = "Verse Token - agent-runtime knowledge representation (HIR .vt / SIR graph / TIR injection)"
requires-python = ">=3.10"

[project.scripts]
vt = "vtoken.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
