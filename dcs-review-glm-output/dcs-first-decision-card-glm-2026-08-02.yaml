# DCS-first 架构评审决策卡 — GLM
# 生成时间: 2026-08-02
# 评审 agent: GLM-5.2
# 评审对象: ClawX DCS-first Context Engine
# 证据最高等级: E2 (受控测试); 无 E4/E5; STATUS.md liveReady=false

decision: revise
confidence: medium-high

core_thesis: >-
  DCS-first 方向正确且 authority 地基真实存在 (orchestrator + turn ledger + kill switch
  + prod-flags-catalog assertCatalogDefaultHonesty 断言, E0/E1), 但三项核心主张
  ("一次编译一次 provider 请求" / ContextUnit epistemic 字段 / admission 在成本之前)
  尚未在代码中实现; attempt.ts 有 6 处 post-orchestrator systemPrompt 覆盖
  (subagent/hooks-legacy/hooks-prepend-append/media/model-identity/runtime-context);
  STATUS.md liveReady=false, real-cohort canary liveObservations=0/providerReceipts=0/
  humanReviews=0。应先关闭 6 处覆盖 + 3 个最小字段 (kind/epistemic.status/priority),
  再讨论 ContextUnit/v1 全 schema 与 Admission Planner。

strengths:
  - "Authority 地基真实且 fail-closed 四层守卫: context-orchestrator + turn-injection-budget + enhancement-kill-switch + prod-flags-catalog:assertCatalogDefaultHonesty() 强制 8 个 flag default=false"
  - "Lineage 内建并有单测锁定: context-candidate.test.ts 用例 4 验证 disposition+reason (applied/truncate/drop/skip/duplicate); degradationOrder 记录预算耗尽时牺牲顺序; 相对 Aider (消息只有 role) 是真实差异化"
  - "默认关闭 + opt-in + 三层一致性测试: default-config-matrix.test.ts 做 md文本↔fixture declaredDefault↔实现探针 byte-for-byte 比对 (FP-P0-07); STATUS.md 三硬锁 liveReady/productApproved/defaultOn=false; Hard lock #4 禁止用单测/E2E 冒充 live 证据"

p0_risks:
  - id: P0-1
    name: attempt-ts-6-post-orchestrator-systemPrompt-overwrites
    evidence: >-
      attempt.ts L2180 声明 systemPromptText, L2537-2540 定义 setActiveSessionSystemPrompt
      闭包 setter, 之后被覆盖 7 次: subagent(L3204-3216), hooks-legacy 完整替换(L3923-3926),
      hooks-prepend-append(L3928-3940), media-task(L3941-3952),
      model-identity+cache-boundary(L3959-3968), runtime-context(L4176-4184),
      raw-model 清空(L2557)。唯一正确路径是 CVK (L3283-3297 走 collectContextOrchestratorCandidate)。
      gateway agent.ts L2527-2529 干净透传。
    impact: >-
      一次编译不成立; orchestrator 只管 memory+vtoken, Assembler 走 candidate 路径 (正确),
      但 subagent/hooks/media/identity/runtime 6 条路径直接覆盖主变量; 不可控注入未解决只是被分散。
    fix: >-
      Phase 1 把 6 处直接覆盖改为 candidate 收集, 让 finalizeContextOrchestratorTurn
      成为唯一 projection authority; hooks-legacy 完整替换是最强破坏点需 owner 决策。
  - id: P0-2
    name: contextunit-fields-aspirational-and-untested
    evidence: >-
      context-candidate.ts:15-28 只有 text/authority/sourceId/channel/target;
      context-candidate.test.ts 4 用例只测试这些字段 + dedupKey/disposition/reason/charsApplied,
      未测试 kind/epistemic.status/priority/freshness/sensitivity/merge/evidenceRefs,
      未测试 admission 四态 (pass_fast/pass_mem/defer/drop), 未测试 receipt replay。
    impact: >-
      无法区分 confirmed vs inferred, 无法过期 stale, 无法关联证据;
      epistemic fence 是装饰非运行时保证。
    fix: Phase 1 加 3 个最小字段 (kind/epistemic.status/priority), 同步加单测。
  - id: P0-3
    name: admission-ordering-wrong
    evidence: >-
      turn-injection-budget charge 发生在候选已生产之后; 设计 §7 自陈成本门控在生产之后;
      chat-turn-memory-injection.ts shouldInjectChatTurnMemory (L106-121) 是开关式 gate 非 admission;
      设计把 ContextUnit/v1 列 P0, Admission 列 P1。
    impact: 先增加 schema 复杂度不解决成本; context tax 会实现。
    fix: admission 应是 reducer 里的 filter 函数, 与最小字段同阶段落地。

p1_risks:
  - id: P1-4
    name: char-level-prefix-truncation-corrupts-structured-context
    evidence: >-
      turn-injection-budget.ts:67 TURN_INJECTION_CHAR_BUDGET=6000, 'single flat pool,
      no per-channel sub-budgets', unit=characters; applyInjectionBudget 做前缀截断;
      chat-turn-vtoken-injection.ts 另有 maxSourceChars=24000/maxSourceFiles=12 截断 (默认关闭)。
    impact: 截断 JSON tool schema / constraint 列表 / code block 是正确性 bug。
    fix: Phase 2 对 kind=constraint/evidence 禁止截断, drop lower-priority 替代。
  - id: P1-5
    name: one-bundle-per-turn-conflicts-with-tool-loop-retry-compact-fork
    evidence: >-
      attempt.ts:2537-2540 setActiveSessionSystemPrompt 闭包在 tool loop 中可被多次调用;
      context-orchestrator.test.ts 9 用例全是单轮 mock, 无 tool loop/retry/compact/fork/handoff 测试,
      未用 ScriptedLlmDriver 或真实 provider。
    impact: tool result 后是否重编译/retry 用同一 bundle/compact 从何权威重建/fork 克隆 bundle 全未答未测。
    fix: 明确 per-model-call 编译 + 稳定前缀 + delta; bundle 是 per-model-call 的 receipt。

p2_risks:
  - "多 authority (Assembler vs Orchestrator vs attempt.ts hooks) 中央编排器漂移风险"
  - "agent-dev-audit/report.json 97/100 grade A 只覆盖 Agent Dev 控制面非 DCS 生产就绪, 且 2026-07-03 生成已 30 天 age-stale 超 24h 窗口"
  - "Working Context 设计为 task-scoped 统一对象, 代码里不存在, 字段散落在 compass/role-memory/working-memory handler"
  - "real-cohort-report.json qualification=no-live-observations, liveObservations=0/providerReceipts=0/humanReviews=0/realProviderUsage=0, 9 engineering scenarios 通过但 0 live"

chosen_ir_changes:
  - "ContextCandidate 加 kind (objective|constraint|fact|decision|risk|evidence|instruction) + epistemic.status (confirmed|inferred|uncertain|stale) + priority (critical|normal) — 3 字段非 10, 同步加单测"
  - "ContextBundle/v1 改为 per-model-call receipt: schema/turnId/modelCallId/promptHash/selectedUnitIds/droppedUnits/charsBySource/totalChars/compiledAt/killSwitchEngaged"
  - "Admission 做成 reducer filter 函数 admit(unit, turnState)->pass_fast|pass_mem|defer|drop+reason, 不是独立组件"
  - "移除 attempt.ts 6 处 post-orchestrator systemPrompt 覆盖 (subagent/hooks-legacy/hooks-prepend-append/media/model-identity/runtime-context), 全部走候选收集; CVK 的 candidate 路径保留"

simpler_alternative: >-
  Reducer+Receipt 架构: 放弃 compiler+bundle 隐喻, 建模为确定性 reducer (INGEST/ADMIT/COMPILE)
  + receipt; v1 只用 5 字段 entry (id/source/text/kind/confidence); admission 是 filter 不是组件;
  receipt 就是 bundle; provider adapter 只接收 (prompt, receipt) 禁止追加;
  现有 ContextCandidate+TurnInjectionLedger 已做 70%, 迁移成本低。

first_milestone: >-
  Phase 1 (单一 authority + 最小字段): 给 ContextCandidate 加 kind/epistemic.status/priority
  3 字段 + 同步单测; 让 finalizeContextOrchestratorTurn 成为唯一 prompt authority,
  移除 attempt.ts 6 处 post-orchestrator 覆盖; emit per-model-call ContextBundle/v1 receipt。
  验收: grep attempt.ts 在 orchestrator 后通过 setActiveSessionSystemPrompt 的直接覆盖=0
  (CVK candidate 路径除外); 每条突变有 lineage; receipt replay 能 bit-for-bit 重建 prompt
  (新增单测填补当前 context-orchestrator.test.ts 无 replay 测试缺口); 现有单测全绿;
  char budget 不变; kill switch 仍 fail-closed; assertCatalogDefaultHonesty 仍通过;
  新增 tool loop 单测 (填补当前 9 用例全单轮缺口)。

rejected_ideas:
  - "在关闭 attempt.ts 6 处覆盖之前实现 ContextUnit/v1 全 schema (会变装饰字段)"
  - "在 admission 之前实现 Mem path (会变 context tax; chat-turn-memory-injection.ts 只是 wiring seam 非语义处理器)"
  - "在真实 corpus 之前实现 unit-aware 摘要 (无法证明保真度)"
  - "通过增加更多 provider/flag/memory layer/UI 状态解决 authority 问题"
  - "把 Working Context 做成独立顶层对象 (应是 ContextUnit 的 scope=task 投影)"
  - "把 Admission Planner 做成独立组件 (应是 reducer filter 函数)"
  - "把 ContextBundle 做成永久不可变 artifact (先 turn-scoped + 可重放, 持久化是 P2)"
  - "任何默认开启 Mem/VToken/SEKB 的提议 (TF-0006 blocked, liveObservations=0, STATUS.md defaultOn=false 硬锁)"
  - "把 agent-dev-audit/report.json 97/100 grade A 当作 DCS 生产就绪证据 (只覆盖 Agent Dev 控制面, 且 30 天 age-stale)"
  - "把 agent-surrogate 10/10/10 当作真人证据 (STATUS.md 显式降级为 degraded-agent-complete, 不得外推)"

evidence_required_before_default_on:
  - "真实 provider (非 ScriptedLlmDriver 非 mock VtokenRpcClient) 的 20+ transcript"
  - "至少 2 个真实渠道的入站消息 canary"
  - "真实脱敏 corpus manifest"
  - "14-28 天 soak + 真人 A/B (≥2 用户, 非 agent-surrogate)"
  - "fidelity 指标: constraint/evidence 单元截断数=0; critical constraint 丢失数=0"
  - "requestId/runId/sessionKey/traceId/cost/latency/tool outcome/approval/side effect digest 相关性日志"
  - "receipt replay bit-for-bit 重建 prompt 测试通过"
  - "失败/恢复统计 + 隐私边界审查 + 产品签署 (productApproved=true)"

owner_questions:
  - "per-turn vs per-model-call bundle: tool loop 一个 turn 多次 model call, bundle 粒度? 建议 per-model-call+稳定前缀+delta, 但改变 '一个 turn 一个 bundle' 表述"
  - "Assembler 是否合并进 Orchestrator: 当前 Assembler 是候选生产者, Orchestrator 是投影者, 分割让 '单一编译器' 表述不准"
  - "attempt.ts hooks-legacy 完整替换 (L3923-3926 hookResult.systemPrompt 完全替换 systemPromptText) 是否保留: 禁止则破坏 hook 扩展点, 保留则破坏单一 authority"
  - "Phase 1 是否允许改变现有 hook/intensity/media 行为: 移除 6 处覆盖可能改变 prompt 内容, 需接受可能输出差异"
  - "agent-dev-audit/report.json age-stale (2026-07-03 生成, 超 24h 窗口) 是否需刷新"

mem_autonomy_4_boundaries:
  capability_profile: "Mem 只做 semantic compression/dedup/conflict-set, 产出 epistemic.status=inferred 的 entry"
  approval_policy: "pass_mem 仅对 kind in {fact,decision,risk} 且长文本触发; SEKB writeback 保持 human-gated"
  effect_receipt: "Mem 产出的 entry 进 reducer, lineage 记 source=mem, 可观测可审计"
  rollback_boundary: "Mem 只产出 entry 不修改源; rollback = drop mem entries, 源数据不变"

cost_optimization_5_dimensions:
  fidelity: "字符截断破坏 JSON schema/constraint list/code block; 无 fidelity 指标; 需 constraint/evidence 截断数=0"
  latency: "orchestrator 仅 memory+vtoken 两 stage 延迟可控; 加 admission 需 <50ms/turn"
  token: "6000 char flat pool 无 per-source sub-budget; 需 admission 在生产前 drop ≥30%"
  failure_recovery: "kill switch fail-closed; 但 bundle 不可恢复 (进程内 Map turn 后删除); 需 receipt replay"
  observability: "lineage 有 disposition+reason+degradationOrder; 但 admission 决策无记录 (不存在); 需 admit() reason 写入 lineage"
