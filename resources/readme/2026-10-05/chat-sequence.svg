  <text x="296.5175" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">chat.send via WebSocket RPC</text>
</g>
<g class="message" data-from="GW" data-to="RUN" data-label="Start the selected agent run" data-line-style="solid" data-arrow-head="filled" data-self="false">
