</g>
<g class="message" data-from="MODEL" data-to="RUN" data-label="Response / tool requests" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="665.312" y1="320" x2="506.5175" y2="320" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="585.91475" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Response / tool requests</text>
</g>
<g class="message" data-from="RUN" data-to="RUN" data-label="Apply tool policy and execute allowed tools" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="506.5175,360 536.5174999999999,360 536.5174999999999,380 506.5175,380" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="544.5174999999999" y="370" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Apply tool policy and execute allowed tools</text>
</g>
<g class="message" data-from="RUN" data-to="GW" data-label="Run and tool events" data-line-style="dashed" data-arrow-head="filled" data-self="false">
