  <text x="296.5175" y="460" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Chat / runtime events</text>
</g>
<g class="message" data-from="HOST" data-to="UI" data-label="host-events updates the stores" data-line-style="dashed" data-arrow-head="filled" data-self="false">
