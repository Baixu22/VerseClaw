  <text x="153.2335" y="500" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">host-events updates the stores</text>
</g>
<g class="note" data-position="over" data-actors="UI,RUN">
  <polygon points="153.29250000000002,518 427.17449999999997,518 433.17449999999997,524 433.17449999999997,541 153.29250000000002,541" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="427.17449999999997,518 433.17449999999997,524 427.17449999999997,524" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="293.2335" y="529.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Sending a request is not proof of successful completion</text>
</g>
<g class="actor" data-id="UI" data-label="Chat / store" data-type="participant">
