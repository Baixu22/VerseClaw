<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' clawx-preview: http://127.0.0.1:* http://localhost:* https: blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob: https: http:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' data: blob: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:* wss://localhost:*; worker-src 'self' blob:; form-action 'self';" />

    <title>Verse Claw</title>
    <script src="./boot-theme.js"></script>
    <style>
      :root {
        color-scheme: light;
        --boot-background: hsl(45 30% 96.6%);
        --boot-sidebar: hsl(45 16% 94%);
        --boot-surface: hsl(45 30% 97.6%);
        --boot-muted: hsl(210 40% 96.1%);
        --boot-highlight: hsl(215.4 16.3% 46.9% / 0.16);
        --boot-border: hsl(214.3 31.8% 91.4%);
      }

      :root.dark {
        color-scheme: dark;
        --boot-background: hsl(240 4% 11%);
        --boot-sidebar: hsl(240 4% 11%);
        --boot-surface: hsl(240 3% 14%);
        --boot-muted: hsl(240 3% 18%);
        --boot-highlight: hsl(220 8% 72% / 0.13);
        --boot-border: hsl(240 3% 24%);
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--boot-background);
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--boot-sidebar);
        opacity: 1;
        transition: opacity 160ms ease-out;
      }

      #boot-shell[data-state='leaving'] {
        pointer-events: none;
        opacity: 0;
      }

      .boot-titlebar {
        height: 40px;
        flex: none;
      }

      .boot-body {
        display: flex;
        min-height: 0;
        flex: 1;
      }

      .boot-sidebar {
        box-sizing: border-box;
        width: 280px;
        flex: none;
        padding: 8px 16px 20px;
        background: var(--boot-sidebar);
      }

      .boot-brand {
        display: flex;
        height: 40px;
        align-items: center;
        gap: 8px;
      }

      .boot-logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        object-fit: contain;
      }

      .boot-nav {
        display: grid;
        gap: 10px;
        padding-top: 14px;
      }

      .boot-nav-row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 28px;
      }

      .boot-content {
        box-sizing: border-box;
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        margin: 0;
        padding: 24px;
        overflow: hidden;
        border-top: 1px solid var(--boot-border);
        border-left: 1px solid var(--boot-border);
        border-top-left-radius: 16px;
        background: var(--boot-background);
      }

      .boot-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--boot-border);
      }

      .boot-messages {
        box-sizing: border-box;
        display: flex;
        width: min(760px, 100%);
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        margin: 0 auto;
        padding: 32px 0;
      }

      .boot-message {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .boot-message-user {
        width: 58%;
        align-self: flex-end;
        padding: 16px;
        border-radius: 16px 16px 4px 16px;
        background: var(--boot-surface);
      }

      .boot-message-copy {
        width: 70%;
        padding-top: 4px;
      }

      .boot-composer {
        box-sizing: border-box;
        width: min(760px, 100%);
        height: 104px;
        flex: none;
        margin: 0 auto;
        padding: 16px;
        border: 1px solid var(--boot-border);
        border-radius: 16px;
        background: var(--boot-surface);
      }

      .boot-composer-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 32px;
      }

      .boot-row {
        display: flex;
        gap: 8px;
      }

      .boot-shimmer {
        display: block;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(110deg, var(--boot-muted) 0%, var(--boot-highlight) 45%, var(--boot-muted) 80%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.8s linear infinite;
      }

      .boot-square {
        width: 28px;
        height: 28px;
        border-radius: 9px;
      }

      @keyframes boot-shimmer {
        to { background-position-x: -200%; }
      }

      :root[data-boot-platform='mac'] .boot-titlebar {
        display: none;
      }

      :root[data-boot-platform='mac'] .boot-sidebar {
        padding-top: 28px;
      }

      @media (max-width: 920px) {
        .boot-sidebar { width: 232px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell { transition: none; }
        .boot-shimmer { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-shell" data-testid="boot-shell" aria-hidden="true">
      <div class="boot-titlebar"></div>
      <div class="boot-body">
        <aside class="boot-sidebar">
          <div class="boot-brand">
            <img class="boot-logo" src="/src/assets/logo.png" alt="" />
            <span class="boot-shimmer" style="width: 54px"></span>
          </div>
          <div class="boot-nav">
            <div class="boot-nav-row"><span class="boot-shimmer boot-square"></span><span class="boot-shimmer" style="width: 92px"></span></div>
            <div class="boot-nav-row"><span class="boot-shimmer boot-square"></span><span class="boot-shimmer" style="width: 118px"></span></div>
            <div class="boot-nav-row"><span class="boot-shimmer boot-square"></span><span class="boot-shimmer" style="width: 76px"></span></div>
            <div class="boot-nav-row"><span class="boot-shimmer boot-square"></span><span class="boot-shimmer" style="width: 104px"></span></div>
          </div>
        </aside>
        <main class="boot-content">
          <div class="boot-toolbar">
            <div><span class="boot-shimmer" style="width: 142px"></span><span class="boot-shimmer" style="width: 78px; height: 9px; margin-top: 9px"></span></div>
            <span class="boot-shimmer boot-square"></span>
          </div>
          <div class="boot-messages">
            <div class="boot-message-user"><span class="boot-shimmer" style="width: 100%"></span><span class="boot-shimmer" style="width: 74%; margin-top: 9px"></span></div>
            <div class="boot-message">
              <span class="boot-shimmer boot-square"></span>
              <div class="boot-message-copy"><span class="boot-shimmer" style="width: 88%"></span><span class="boot-shimmer" style="width: 100%; margin-top: 9px"></span><span class="boot-shimmer" style="width: 62%; margin-top: 9px"></span></div>
            </div>
          </div>
          <div class="boot-composer">
            <span class="boot-shimmer" style="width: 38%"></span>
            <div class="boot-composer-actions"><div class="boot-row"><span class="boot-shimmer boot-square"></span><span class="boot-shimmer boot-square"></span></div><span class="boot-shimmer boot-square"></span></div>
          </div>
        </main>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
