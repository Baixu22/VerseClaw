# Verse Claw CI Workflow
# Runs on pull requests (main/develop) 
name: Check and Build

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Provenance tests and task diffBase checks require historical ancestors.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Check source and local artifact boundary
        run: node scripts/check-repository-artifacts.mjs

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate extension bridge
        run: pnpm run ext:bridge

      - name: Run linter
        run: pnpm run lint:check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run openclaw_runtime typecheck (tsgo)
        run: pnpm --dir openclaw_runtime run tsgo:prod

      - name: Run openclaw_runtime vitest manifest path check
        run: pnpm --dir openclaw_runtime run check:vitest-manifest-paths

      - name: Run openclaw_runtime unit tests
        run: pnpm --dir openclaw_runtime run test:unit

      - name: Run host-api contract check
        run: pnpm run contract:check

      - name: Run i18n lint
        run: pnpm run i18n:lint

      - name: Run tests
        run: pnpm run test

      - name: Run harness checks
        run: pnpm run harness:ci

      - name: Run supply-chain integrity policy
        run: pnpm run release:supply-chain-policy

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-artifacts
          path: artifacts/harness
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate extension bridge
        run: pnpm run ext:bridge

      - name: Build
        run: pnpm run build:vite
