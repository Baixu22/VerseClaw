# Verse Claw Release Workflow
# Builds and publishes releases for macOS, Windows, and Linux

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # Fails fast on tag pushes if package.json "version" does not match the tag.
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Assert tag matches package.json
        run: node scripts/assert-tag-matches-package.mjs

  # P6-005: packaging cannot start until a clean, ref-bound source snapshot has
  # passed every full release gate with hash-addressed evidence.
  release-baseline:
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install pinned VerseShell Rust toolchain
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.94.0-x86_64-pc-windows-msvc
          cargo --version
          rustc -vV

      - name: Install pinned Python verifier dependency
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest==6.2.5
          python -m pytest --version

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm intentionally blocks Electron's package postinstall. Install the
      # binary with the same hardened path used by electron-e2e.yml so unit and
      # Playwright release gates cannot false-pass without an Electron runtime.
      - name: Install Electron binary for release gates
        shell: pwsh
        env:
          force_no_cache: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          $electronDir = node -p "require('path').dirname(require.resolve('electron/package.json'))"
          Remove-Item -Recurse -Force "$electronDir\dist", "$electronDir\path.txt" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$electronDir\dist" | Out-Null

          Push-Location $electronDir
          try {
            $zip = node -e "const { downloadArtifact } = require('@electron/get'); const { version } = require('./package.json'); downloadArtifact({ version, artifactName: 'electron', force: true }).then((z) => { process.stdout.write(z); process.exit(0); }).catch((e) => { console.error(e); process.exit(1); });"
          } finally {
            Pop-Location
          }
          Expand-Archive -LiteralPath $zip -DestinationPath "$electronDir\dist" -Force
          $typeDef = Join-Path $electronDir 'dist\electron.d.ts'
          if (Test-Path -LiteralPath $typeDef) {
            Move-Item -LiteralPath $typeDef -Destination (Join-Path $electronDir 'electron.d.ts') -Force
          }
          $exe = Join-Path $electronDir 'dist\electron.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "electron.exe missing after extract: $exe"
          }
          Set-Content -LiteralPath (Join-Path $electronDir 'path.txt') -Value 'electron.exe' -NoNewline
          pnpm exec electron --version

      - name: P6-005 collect clean release baseline evidence
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } else {
            '${{ github.event.inputs.version }}'
          }
          node scripts/collect-p6-005-evidence.mjs `
            --out "$env:RUNNER_TEMP\release-baseline" `
            --version "$version" `
            --ref "$env:GITHUB_REF" `
            --commit "$env:GITHUB_SHA"

      - name: Upload P6-005 release baseline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-baseline
          path: ${{ runner.temp }}/release-baseline
          if-no-files-found: error
          retention-days: 30

  release:
    needs: release-baseline
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download P6-005 release baseline evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-baseline
          path: ${{ runner.temp }}/release-baseline

      - name: P6-005 verify source and full-gate evidence before packaging
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          node scripts/validate-release-baseline.mjs \
            --manifest "${RUNNER_TEMP}/release-baseline/release-source-manifest.json" \
            --evidence "${RUNNER_TEMP}/release-baseline/release-gate-evidence.json" \
            --version "${VERSION}" \
            --ref "${GITHUB_REF}" \
            --commit "${GITHUB_SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run uv:download:mac

      - name: Download uv binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run uv:download:win

      - name: Download uv binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run uv:download:linux

      - name: Download agent-browser binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run agent-browser:download:mac

      - name: Download agent-browser binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run agent-browser:download:win

      - name: Download agent-browser binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run agent-browser:download:linux


      # macOS specific steps
      - name: Free disk space (macOS)
        if: matrix.platform == 'mac'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          # Remove large pre-installed toolchains not needed for Electron builds
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          rm -rf ~/Library/Caches/electron-builder/dmg-builder* || true
          # Homebrew cleanup
          brew cleanup --prune=all 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      # --publish never: prevent electron-builder from auto-publishing to GitHub.
      # All artifacts are collected and published atomically in the publish job.
      - name: Build macOS
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ulimit -n 65536
          echo "File descriptor limit: $(ulimit -n)"
          pnpm run package:mac

      # Windows specific steps
      - name: Build Windows
        if: matrix.platform == 'win'
        run: pnpm run package:win

      # P6-001: derive channel/signing/public-target outputs from the single policy module.
      - name: Detect Windows release channel
        if: matrix.platform == 'win'
        id: win-channel
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          node scripts/validate-windows-release-policy.mjs --github-output --version "$TAG"

      # P6-001: codified channel policy must agree with this workflow
      - name: P6-001 assert Windows signing policy for channel
        if: matrix.platform == 'win'
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          node scripts/validate-windows-release-policy.mjs --print-policy --version "$TAG"
          # Self-check + workflow anchors (A1)
          node scripts/validate-windows-release-policy.mjs

      - name: Validate unsigned Windows artifacts before SignPath
        if: matrix.platform == 'win' && steps.win-channel.outputs.requires_signing == 'true'
        shell: pwsh
        run: |
          $unsignedExeFiles = Get-ChildItem -Path "release" -Filter *.exe -File
          if (-not $unsignedExeFiles) {
            throw "No unsigned .exe files found in release/ before SignPath upload"
          }
          $unsignedCount = $unsignedExeFiles.Count
          "UNSIGNED_EXE_COUNT=$unsignedCount" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found $unsignedCount unsigned .exe file(s):"
          $unsignedExeFiles | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Upload unsigned Windows artifacts for SignPath
        if: matrix.platform == 'win' && steps.win-channel.outputs.requires_signing == 'true'
        id: upload-unsigned-windows-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-win-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*.exe
          retention-days: 1

      - name: Sign Windows artifacts via SignPath
        if: matrix.platform == 'win' && steps.win-channel.outputs.requires_signing == 'true'
        id: signpath-sign-windows
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "78e37079-23df-4800-b41c-33312ad7c1e3"
          project-slug: "ValueCell"
          signing-policy-slug: "ValueCell-sign"
          github-artifact-id: ${{ steps.upload-unsigned-windows-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed

      - name: Replace unsigned executables with signed ones
        if: matrix.platform == 'win' && steps.win-channel.outputs.requires_signing == 'true'
        shell: pwsh
        run: |
          Write-Host "SignPath GitHub artifact ID: ${{ steps.upload-unsigned-windows-artifact.outputs.artifact-id }}"
          $signedExeFiles = Get-ChildItem -Path "release/signed" -Filter *.exe -File -Recurse
          if (-not $signedExeFiles) {
            throw "No signed .exe files found in release/signed"
          }
          $signedCount = $signedExeFiles.Count
          if ($env:UNSIGNED_EXE_COUNT -and ($signedCount -ne [int]$env:UNSIGNED_EXE_COUNT)) {
            throw "Signed .exe count ($signedCount) does not match unsigned count ($env:UNSIGNED_EXE_COUNT)"
          }
          foreach ($file in $signedExeFiles) {
            Copy-Item -Path $file.FullName -Destination "release/$($file.Name)" -Force
          }
          $finalExeFiles = Get-ChildItem -Path "release" -Filter *.exe -File
          if ($env:UNSIGNED_EXE_COUNT -and ($finalExeFiles.Count -ne [int]$env:UNSIGNED_EXE_COUNT)) {
            throw "Final release .exe count ($($finalExeFiles.Count)) does not match unsigned count ($env:UNSIGNED_EXE_COUNT)"
          }
          Write-Host "Signed executables copied to release/ ($($finalExeFiles.Count) file(s))"

      # Code signing changes the .exe binary, invalidating the sha512 hash that
      # electron-builder wrote into latest.yml during the initial build.
      # Recalculate the hash for each signed .exe and patch the yml files so
      # electron-updater can verify the download successfully.
      #
      # Actual latest.yml structure (from electron-builder NSIS):
      #   files:
      #     - url: Verse Claw-0.2.4-win-x64.exe    ← files[] entries have url/sha512/size
      #       sha512: <base64>
      #       size: 430775882
      #   path: Verse Claw-0.2.4-win-arm64.exe      ← top-level has path/sha512 (no size!)
      #   sha512: <base64>
      #   releaseDate: '...'
      - name: Update latest.yml sha512 after code signing
        if: matrix.platform == 'win' && steps.win-channel.outputs.requires_signing == 'true'
        shell: pwsh
        run: |
          $ymlFiles = Get-ChildItem -Path "release" -Filter "*.yml" -File | Where-Object { $_.Name -ne "builder-debug.yml" }
          $exeFiles = Get-ChildItem -Path "release" -Filter "*.exe" -File

          foreach ($yml in $ymlFiles) {
            $content = Get-Content $yml.FullName -Raw
            $modified = $false

            foreach ($exe in $exeFiles) {
              # Compute new sha512 (base64) for the signed exe
              $hash = Get-FileHash -Path $exe.FullName -Algorithm SHA512
              $hashBytes = [byte[]]::new($hash.Hash.Length / 2)
              for ($i = 0; $i -lt $hashBytes.Length; $i++) {
                $hashBytes[$i] = [Convert]::ToByte($hash.Hash.Substring($i * 2, 2), 16)
              }
              $newSha512 = [Convert]::ToBase64String($hashBytes)
              $newSize = (Get-Item $exe.FullName).Length
              $escapedName = [Regex]::Escape($exe.Name)

              # 1) files[] entries:  url: <name>\n    sha512: <hash>\n    size: <n>
              $urlPattern = "(?m)(url:\s*${escapedName}\s*\r?\n\s*sha512:\s*)(\S+)(\s*\r?\n\s*size:\s*)(\d+)"
              if ($content -match $urlPattern) {
                $content = $content -replace $urlPattern, "`${1}${newSha512}`${3}${newSize}"
                $modified = $true
                Write-Host "Updated $($yml.Name) files[]: $($exe.Name) sha512=$newSha512 size=$newSize"
              }

              # 2) Top-level entry:  path: <name>\nsha512: <hash>\n  (no size field)
              $pathPattern = "(?m)(path:\s*${escapedName}\s*\r?\n)sha512:\s*\S+"
              if ($content -match $pathPattern) {
                $content = $content -replace $pathPattern, "`${1}sha512: ${newSha512}"
                $modified = $true
                Write-Host "Updated $($yml.Name) top-level: $($exe.Name) sha512=$newSha512"
              }
            }

            if ($modified) {
              Set-Content -Path $yml.FullName -Value $content -NoNewline
              Write-Host "Saved updated $($yml.Name)"
            }
          }

          Write-Host ""
          Write-Host "=== Final yml contents ==="
          foreach ($yml in $ymlFiles) {
            Write-Host "--- $($yml.Name) ---"
            Get-Content $yml.FullName
            Write-Host ""
          }

      # P6-001 A3: verify latest.yml hashes match on-disk signed artifacts
      - name: P6-001 verify latest.yml sha512 after signing
        if: matrix.platform == 'win' && steps.win-channel.outputs.requires_signing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for yml in release/*.yml; do
            case "$(basename "$yml")" in
              builder-debug.yml) continue ;;
            esac
            # Only verify yml files that reference .exe
            if grep -q '\.exe' "$yml"; then
              echo "Verifying $yml"
              node scripts/validate-windows-release-policy.mjs --verify-yml "$yml" --artifact-dir release
            fi
          done

      # P6-001 A2: validate Authenticode and write the attestation consumed by
      # the pre-publish gate. The signed bit comes from real signature checks.
      - name: P6-001 verify Authenticode and write signing attestation
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = '${{ steps.win-channel.outputs.version }}'
          $channel = '${{ steps.win-channel.outputs.channel }}'
          $requiresSigning = '${{ steps.win-channel.outputs.requires_signing }}' -eq 'true'
          $targetPublic = '${{ steps.win-channel.outputs.target_public }}' -eq 'true'
          $exeFiles = @(Get-ChildItem -Path "release" -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($exeFiles.Count -eq 0) {
            throw "No Windows .exe artifacts found for signing attestation"
          }

          $signatures = @()
          if ($requiresSigning) {
            foreach ($exe in $exeFiles) {
              $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
              if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
                throw "Authenticode verification failed for $($exe.Name): $($signature.Status) $($signature.StatusMessage)"
              }
              $signatures += [ordered]@{
                name = $exe.Name
                status = $signature.Status.ToString()
                signerSubject = $signature.SignerCertificate.Subject
                signerThumbprint = $signature.SignerCertificate.Thumbprint
                timestampSubject = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { $null }
              }
            }
          }

          $verifiedNames = if ($requiresSigning) { @($signatures | ForEach-Object { $_.name }) } else { @() }
          $att = [ordered]@{
            schemaVersion = 1
            task = 'P6-001'
            platform = 'win'
            version = $version
            channel = $channel
            requiresCodeSigning = $requiresSigning
            targetPublicPublish = $targetPublic
            isStable = $channel -eq 'stable'
            windowsArtifactsSigned = $requiresSigning
            exeCount = $exeFiles.Count
            exeNames = @($exeFiles | ForEach-Object { $_.Name })
            signatureVerification = [ordered]@{
              status = if ($requiresSigning) { 'verified' } else { 'not-required' }
              verifiedExeCount = $verifiedNames.Count
              verifiedExeNames = $verifiedNames
              signatures = $signatures
            }
            signedAt = (Get-Date).ToUniversalTime().ToString('o')
            policy = 'shared/release-policy/windows-signing-policy.mjs'
          }
          if (-not (Test-Path "release")) { New-Item -ItemType Directory -Path "release" | Out-Null }
          $att | ConvertTo-Json -Depth 5 | Set-Content -Path "release/windows-signing-attestation.json" -Encoding utf8
          Write-Host "Wrote release/windows-signing-attestation.json"
          Get-Content "release/windows-signing-attestation.json"

      # Linux specific steps
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: pnpm run package:linux

      - name: P6-004 verify packaged Electron fuse wire and app.asar digest
        run: node scripts/verify-packaged-electron-trust.mjs --app-dir release --platform "${{ matrix.platform }}" --output "release/${{ matrix.platform }}-electron-trust.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            release/windows-signing-attestation.json
            release/*-electron-trust.json
            !release/builder-debug.yml
          retention-days: 7

  # P6-001 A2: no GitHub release or OSS upload may start until the Windows
  # signing attestation has been validated against the codified policy.
  release-policy-gate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download release artifacts only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: P6-001 pre-publish Windows policy gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          mapfile -t ATTESTATIONS < <(find release-artifacts -name 'windows-signing-attestation.json' -type f)
          if [[ "${#ATTESTATIONS[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one Windows signing attestation, found ${#ATTESTATIONS[@]}"
            printf '%s\n' "${ATTESTATIONS[@]:-}"
            exit 1
          fi

          node scripts/validate-windows-release-policy.mjs \
            --gate-attestation "${ATTESTATIONS[0]}" \
            --version "$VERSION"

      - name: P6-002 assert update feed source and channel policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          node scripts/validate-windows-update-feed-policy.mts --version "$VERSION"

      - name: P6-003 assert pinned supply-chain inputs
        run: node scripts/validate-supply-chain-integrity.mjs

      - name: P6-004 generate release SBOM and provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          node scripts/generate-release-trust-metadata.mjs \
            --artifacts release-artifacts \
            --out release-trust-metadata \
            --version "$VERSION" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: P6-004 validate portable SBOM and provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          node scripts/validate-release-trust-metadata.mjs \
            --artifacts release-artifacts \
            --inventory release-trust-metadata/release-artifact-inventory.json \
            --sbom release-trust-metadata/release-sbom.cdx.json \
            --provenance release-trust-metadata/release-provenance.intoto.json \
            --version "$VERSION" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}"

      - name: P6-004 attest build provenance
        id: attest-build-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/**/*

      - name: P6-004 attest release SBOM
        id: attest-release-sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: release-artifacts/**/*
          sbom-path: release-trust-metadata/release-sbom.cdx.json

      - name: Collect portable GitHub attestation bundles
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest-build-provenance.outputs.bundle-path }}" release-trust-metadata/github-build-provenance.sigstore.json
          cp "${{ steps.attest-release-sbom.outputs.bundle-path }}" release-trust-metadata/github-sbom.sigstore.json
          test -s release-trust-metadata/github-build-provenance.sigstore.json
          test -s release-trust-metadata/github-sbom.sigstore.json

      - name: Upload release trust metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-trust-metadata
          path: release-trust-metadata
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Job: Publish to GitHub Releases
  # ──────────────────────────────────────────────────────────────
  publish:
    needs: release-policy-gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Download release artifacts only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: List all downloaded artifacts
        run: |
          echo "=== All artifacts downloaded ==="
          find release-artifacts/ -type f -exec ls -lh {} \;
          echo ""
          echo "=== File tree ==="
          tree release-artifacts/ || find release-artifacts/ -print

      - name: Remove duplicate builder-debug files
        run: |
          echo "Removing builder-debug.yml files to avoid duplicate asset upload conflicts..."
          find release-artifacts/ -name "builder-debug.yml" -delete -print || true

      - name: Create GitHub Release (as pre-release)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.yml
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## 🚀 Verse Claw ${{ github.ref_name }}
            
            Verse Claw - Graphical AI Assistant based on OpenClaw
            
            ### 📦 Downloads
            
            This is a **Controlled Preview** build. Only **Windows x64** is published in this channel.
            
            #### Windows
            - **Installer (x64)**: `Verse Claw-*-win-x64.exe`
            
            > macOS, Linux, and Windows ARM64 installers are **not** published in this preview channel. They will be added in a future release once their validation is complete (see FP-P3-02).
            
            ### 📝 Release Notes
            
            See the auto-generated release notes below for detailed changes.
            
            ### ⚠️ Installation Notes
            
            - **macOS**: On first launch, you may see "cannot verify developer". Go to System Preferences → Security & Privacy to allow the app to run
            - **Windows**: SmartScreen may block the app. Click "More info" → "Run anyway" to proceed
            - **Linux AppImage**: First run `chmod +x Verse Claw-*.AppImage` to add execute permission. On Ubuntu 22.04 you may also need `sudo apt install libfuse2`; on Ubuntu 24.04 use `sudo apt install libfuse2t64`
            - **Linux .deb (Ubuntu 24.04)**: If installation fails due to missing dependencies, use `sudo apt install libgtk-3-0t64 libnotify4t64 libxss1t64` before installing
            
            ---
            
            💬 Found an issue? Please submit an [Issue](https://github.com/${{ github.repository }}/issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Job: Upload to Alibaba Cloud OSS
  # Uploads all release artifacts to OSS for:
  #   - Official website downloads (via release-info.json)
  #   - electron-updater auto-update (via latest*.yml inside each channel directory)
  #
  # Directory structure on OSS (channel-separated):
  #   latest/          → stable releases (latest.yml, latest-mac.yml, …)
  #   alpha/           → alpha  releases (latest.yml, latest-mac.yml, …)
  #   beta/            → beta   releases (latest.yml, latest-mac.yml, …)
  #   releases/vX.Y.Z/ → permanent archive, never deleted
  # ──────────────────────────────────────────────────────────────
  upload-oss:
    needs: release-policy-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download release artifacts only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: Extract version and channel
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          # Detect channel from semver prerelease tag
          # e.g. 0.1.8-alpha.0 → alpha, 1.0.0-beta.1 → beta, 1.0.0 → latest
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="latest"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}, channel: ${CHANNEL}"

      - name: Prepare upload directories
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          mkdir -p staging/${CHANNEL}
          mkdir -p staging/releases/${TAG}

          # Flatten all platform artifacts into staging directories
          find release-artifacts/ -type f | while read file; do
            filename=$(basename "$file")
            cp "$file" "staging/${CHANNEL}/${filename}"
            cp "$file" "staging/releases/${TAG}/${filename}"
          done

          echo "=== staging/${CHANNEL}/ ==="
          ls -lh staging/${CHANNEL}/
          echo ""
          echo "=== staging/releases/${TAG}/ ==="
          ls -lh staging/releases/${TAG}/

      # Note: Do NOT rename yml files. electron-updater (generic provider) always
      # requests "latest-mac.yml", "latest.yml", etc. regardless of feed URL.
      # Channel separation is achieved by directory: /alpha/, /beta/, /latest/.
      - name: Verify exact updater metadata is present
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"
          echo "=== staging/${CHANNEL}/ (update metadata) ==="
          test -f "staging/${CHANNEL}/latest.yml"
          ls -la "staging/${CHANNEL}/latest.yml"

      - name: Generate release-info.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          BASE_URL="https://oss.intelli-spectrum.com/${CHANNEL}"

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$BASE_URL" \
            --arg changelog "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            '{
              version: $version,
              channel: $channel,
              releaseDate: $date,
              downloads: {
                win: {
                  x64: ($base + "/Verse Claw-" + $version + "-win-x64.exe")
                }
              },
              changelog: $changelog
            }' > staging/${CHANNEL}/release-info.json

          echo "=== release-info.json ==="
          cat staging/${CHANNEL}/release-info.json

      - name: Install pinned ossutil
        run: |
          node scripts/install-pinned-ossutil.mjs --output "$RUNNER_TEMP/ossutil-bin"
          echo "$RUNNER_TEMP/ossutil-bin" >> "$GITHUB_PATH"

      - name: Configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          # Write config file for non-interactive use
          cat > $HOME/.ossutilconfig << EOF
          [Credentials]
          language=EN
          endpoint=oss-cn-hangzhou.aliyuncs.com
          accessKeyID=${OSS_ACCESS_KEY_ID}
          accessKeySecret=${OSS_ACCESS_KEY_SECRET}
          EOF

          ossutil --version

      - name: "Upload to OSS: {channel}/ (overwrite)"
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"

          # Only clean the current channel's directory — never touch other channels
          ossutil rm -r -f oss://valuecell-clawx/${CHANNEL}/ || true

          # Upload all files with no-cache so clients always get the freshest version
          ossutil cp -r -f \
            --meta="Cache-Control:no-cache,no-store,must-revalidate" \
            staging/${CHANNEL}/ \
            oss://valuecell-clawx/${CHANNEL}/

          echo "Uploaded to ${CHANNEL}/"

      - name: "Upload to OSS: releases/vX.Y.Z/ (archive)"
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Upload to permanent archive (long cache, immutable)
          ossutil cp -r \
            staging/releases/${TAG}/ \
            oss://valuecell-clawx/releases/${TAG}/ \
            --meta "Cache-Control:public,max-age=31536000,immutable"

          echo "Uploaded to releases/${TAG}/"

      - name: Verify OSS upload
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          echo "=== ${CHANNEL}/ ==="
          ossutil ls oss://valuecell-clawx/${CHANNEL}/ --short

          echo ""
          echo "=== releases/${TAG}/ ==="
          ossutil ls oss://valuecell-clawx/releases/${TAG}/ --short

          echo ""
          echo "=== Verify release-info.json ==="
          ossutil cp oss://valuecell-clawx/${CHANNEL}/release-info.json /tmp/release-info.json -f
          jq . /tmp/release-info.json

          echo ""
          echo "=== Verify update yml ==="
          if [ "${CHANNEL}" = "latest" ]; then
            YML_PREFIX="latest"
          else
            YML_PREFIX="${CHANNEL}"
          fi
          echo "electron-updater expects ${YML_PREFIX}-mac.yml, ${YML_PREFIX}.yml, etc. in ${CHANNEL}/:"
          ossutil ls oss://valuecell-clawx/${CHANNEL}/ --short | grep "${YML_PREFIX}.*\\.yml" || echo "(none found)"
          
          echo ""
          echo "All files uploaded and verified successfully!"

  # ──────────────────────────────────────────────────────────────
  # Job: Finalize Release
  # Promotes the GitHub Release from pre-release to latest AFTER
  # both GitHub Release assets and OSS uploads are fully complete.
  # This ensures /releases/latest API never returns an incomplete
  # release — the website and electron-updater only see it when
  # all platform artifacts are ready.
  # ──────────────────────────────────────────────────────────────
  finalize:
    needs: [publish, upload-oss]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Promote release from pre-release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IS_PRERELEASE_CHANNEL=false

          if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]]; then
            IS_PRERELEASE_CHANNEL=true
          fi

          if [ "$IS_PRERELEASE_CHANNEL" = "true" ]; then
            echo "Tag $TAG is an alpha/beta release — keeping as pre-release."
          else
            echo "Promoting $TAG from pre-release to latest release..."
            gh release edit "$TAG" \
              --prerelease=false \
              --latest \
              --repo "${{ github.repository }}"
            echo "Release $TAG is now the latest release."
          fi
