name: System Maturity Security Regression

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'openclaw_runtime/src/**'
      - 'shared/**'
      - 'src/**'
      - 'scripts/run-system-maturity-security-suite.mjs'
      - 'scripts/lib/system-maturity-security-suite.mjs'
      - 'plans/system-maturity/security-regression-suite.json'
      - 'tests/unit/**'
      - '.github/workflows/system-maturity-security.yml'

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary for security tests
        shell: bash
        run: |
          electron_dir="$(node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          node "$electron_dir/install.js"
          pnpm exec electron --version

      - name: Run P0/P1 security regression
        env:
          SYSTEM_MATURITY_SECURITY_OUT: ${{ runner.temp }}/system-maturity-security
        run: pnpm maturity:security

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-maturity-security
          path: ${{ runner.temp }}/system-maturity-security
          if-no-files-found: error
