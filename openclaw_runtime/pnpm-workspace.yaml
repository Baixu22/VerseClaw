packages:
  - .
  - extensions/*
  - packages/*
  - ui

# pnpm 11 reads hoisting settings only from pnpm-workspace.yaml (not .npmrc).
# Hoisting is required so the runtime typecheck (tsgo all, NodeNext resolution)
# can resolve extension and test helper imports (e.g. @aws-sdk/*, baileys) from
# the workspace root node_modules in fresh detached acceptance worktrees,
# matching the layout the main worktree has accumulated.
shamefullyHoist: true

allowBuilds:
  '@google/genai': false
  '@matrix-org/matrix-sdk-crypto-nodejs': false
  '@tloncorp/tlon-skill': false
  baileys: false
  esbuild: false
  openclaw: false
  protobufjs: false
  sharp: false
  tree-sitter: true
  tree-sitter-bash: false
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-python: true
  tree-sitter-rust: true

# TEMP: allow baileys@7.0.0-rc.9 -> libsignal git subdependency (same as root workspace).
# Debt: upgrade baileys >=7.0.0-rc12 (GHSA-qvv5-jq5g-4cgg) then drop this flag.
blockExoticSubdeps: false
